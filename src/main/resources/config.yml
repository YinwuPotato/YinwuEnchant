# 附魔台模拟 — 自定义附魔进入附魔台
enchanting-table:
  enabled: true
  # 每次附魔出现自定义附魔的概率 (0-1)，概率触发不保证必出
  chance: 0.02
  # 是否允许诅咒附魔从附魔台出
  include-curses: true
  # 出现的自定义附魔数量范围（当前固定 1）
  count-min: 1
  count-max: 1

# 调试模式
debug: false