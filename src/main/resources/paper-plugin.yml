name: ${project.name}
version: '${project.version}'
main: yinwuenchant.YinwuEnchantments
bootstrap: yinwuenchant.YinwuEnchantBootstrap
api-version: '1.21'
folia-supported: true
authors: ['qumingjam']
description: '添加自定义附魔'
commands:
    ye:
        description: '自定义附魔插件主命令'
        aliases: ['yinwuenchant']
permissions:
    yinwuenchant.use:
        description: '使用自定义附魔命令'
        default: true
    yinwuenchant.admin:
        description: '管理自定义附魔插件'
        default: op
