name: ${project.name}
version: '${project.version}'
main: yinwuenchant.YinwuEnchantments
api-version: '1.21'
folia-supported: true
authors: ['qumingjam']
description: '34 个自定义附魔（含 NeoEnchant 移植）：攻击/工具/弓/负面诅咒，附魔台概率获取 + 铁砧合并，每物品独立开关'
commands:
    yinwuenchant:
        description: '自定义附魔插件主命令'
        aliases: ['ye']
        permission: yinwu.enchant.use
permissions:
    yinwu.enchant.use:
        description: '使用自定义附魔命令'
        default: true
    yinwu.enchant.admin:
        description: '管理自定义附魔插件'
        default: op
